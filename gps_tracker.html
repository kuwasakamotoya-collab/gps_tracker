<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>GPS位置記録アプリ</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --accent: #4f8ef7;
    --accent2: #38d9a9;
    --danger: #f06060;
    --text: #e8eaf0;
    --text2: #8b90a8;
    --border: rgba(255,255,255,0.08);
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 24px;
  }
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    position: sticky;
    top: 0;
    z-index: 1000;
  }
  header h1 {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.02em;
    flex: 1;
  }
  #countBadge {
    background: var(--accent);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 99px;
    letter-spacing: 0.04em;
  }
  .main { padding: 14px 14px 0; }

  /* ステータス */
  #statusBar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 11px 14px;
    font-size: 13px;
    color: var(--text2);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 44px;
    transition: border-color 0.3s;
  }
  #statusBar.success { border-color: var(--accent2); color: var(--accent2); }
  #statusBar.danger  { border-color: var(--danger);  color: var(--danger);  }
  #statusBar.loading { border-color: var(--accent);  color: var(--accent);  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
  .dot.pulse { animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.2} }

  /* 地図 */
  #map {
    width: 100%;
    height: 240px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    overflow: hidden;
    margin-bottom: 12px;
  }

  /* ボタン列 */
  .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .btn-row button { padding: 13px 8px; border-radius: var(--radius); border: none; font-size: 14px; font-weight: 700; cursor: pointer; transition: transform 0.1s, opacity 0.2s; letter-spacing: 0.02em; }
  .btn-row button:active { transform: scale(0.97); }
  .btn-record { background: var(--accent); color: #fff; grid-column: 1 / -1; font-size: 16px; padding: 16px; }
  .btn-record:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-csv { background: var(--surface2); color: var(--accent2); border: 1px solid var(--accent2) !important; }
  .btn-del  { background: var(--surface2); color: var(--danger);  border: 1px solid var(--danger)  !important; }

  /* ログ */
  .section-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text2);
    margin-bottom: 8px;
    padding-left: 2px;
  }
  .log-list { display: flex; flex-direction: column; gap: 8px; }
  .log-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 11px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: border-color 0.2s;
  }
  .log-item:active { border-color: var(--accent); }
  .log-num {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .log-info { flex: 1; min-width: 0; }
  .log-time { font-size: 13px; font-weight: 600; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .log-coords { font-size: 11px; color: var(--text2); font-family: monospace; }
  .log-acc { font-size: 11px; color: var(--accent2); margin-top: 2px; }
  .log-del {
    background: none;
    border: none;
    color: var(--text2);
    font-size: 20px;
    cursor: pointer;
    padding: 4px 6px;
    line-height: 1;
    border-radius: 8px;
    flex-shrink: 0;
  }
  .log-del:active { background: var(--surface2); color: var(--danger); }
  .empty {
    text-align: center;
    color: var(--text2);
    font-size: 14px;
    padding: 32px 0;
  }
</style>
</head>
<body>
<header>
  <h1>📍 GPS位置記録</h1>
  <span id="countBadge">0件</span>
</header>

<div class="main">
  <div id="statusBar">
    <span class="dot"></span>
    <span id="statusText">ボタンを押して現在地を記録してください</span>
  </div>

  <div id="map"></div>

  <div class="btn-row">
    <button class="btn-record" id="btnRecord" onclick="recordLocation()">
      ▶ 現在地を記録する
    </button>
    <button class="btn-csv" onclick="exportCSV()">⬇ CSV</button>
    <button class="btn-del" onclick="clearAll()">🗑 全削除</button>
  </div>

  <p class="section-title">記録ログ</p>
  <div class="log-list" id="logList">
    <div class="empty">まだ記録がありません</div>
  </div>
</div>

<script>
const STORAGE_KEY = 'gps_tracker_locations';
let map, markers = [], locations = [];

function initMap() {
  map = L.map('map', { zoomControl: true }).setView([35.5, 137.0], 9);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors', maxZoom: 19
  }).addTo(map);
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    locations = raw ? JSON.parse(raw) : [];
  } catch(e) { locations = []; }
  renderAll();
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(locations));
}

function setStatus(msg, type = '') {
  const bar = document.getElementById('statusBar');
  bar.className = type;
  const dot = bar.querySelector('.dot');
  dot.className = 'dot' + (type === 'loading' ? ' pulse' : '');
  document.getElementById('statusText').textContent = msg;
}

function recordLocation() {
  if (!navigator.geolocation) {
    setStatus('このブラウザは位置情報に対応していません', 'danger'); return;
  }
  setStatus('GPS取得中... しばらくお待ちください', 'loading');
  document.getElementById('btnRecord').disabled = true;

  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const { latitude: lat, longitude: lng, accuracy } = pos.coords;
      const now = new Date();
      const entry = {
        id: Date.now(),
        lat, lng,
        accuracy: Math.round(accuracy),
        label: now.toLocaleString('ja-JP', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit' })
      };
      locations.push(entry);
      saveData();
      renderAll();
      map.setView([lat, lng], 16);
      setStatus(`記録しました ✓ — ${entry.label}（精度 ±${entry.accuracy}m）`, 'success');
      document.getElementById('btnRecord').disabled = false;
    },
    (err) => {
      const msgs = {1:'位置情報の許可が必要です（ブラウザ設定を確認してください）', 2:'位置情報を取得できませんでした', 3:'タイムアウトしました。屋外でお試しください'};
      setStatus(msgs[err.code] || 'エラーが発生しました', 'danger');
      document.getElementById('btnRecord').disabled = false;
    },
    { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
  );
}

function renderAll() {
  markers.forEach(m => map.removeLayer(m));
  markers = [];

  locations.forEach((loc, i) => {
    const m = L.marker([loc.lat, loc.lng])
      .addTo(map)
      .bindPopup(`<b>#${i+1}</b><br>${loc.label}<br>精度: ±${loc.accuracy}m<br>緯度: ${loc.lat.toFixed(6)}<br>経度: ${loc.lng.toFixed(6)}`);
    markers.push(m);
  });

  if (locations.length > 1) {
    const group = L.featureGroup(markers);
    map.fitBounds(group.getBounds().pad(0.2));
  } else if (locations.length === 1) {
    map.setView([locations[0].lat, locations[0].lng], 15);
  }

  document.getElementById('countBadge').textContent = locations.length + '件';
  renderLog();
}

function renderLog() {
  const el = document.getElementById('logList');
  if (locations.length === 0) {
    el.innerHTML = '<div class="empty">まだ記録がありません</div>';
    return;
  }
  el.innerHTML = [...locations].reverse().map((loc, ri) => {
    const i = locations.length - 1 - ri;
    return `<div class="log-item" onclick="map.setView([${loc.lat},${loc.lng}],17); markers[${i}].openPopup();">
      <div class="log-num">${i+1}</div>
      <div class="log-info">
        <div class="log-time">${loc.label}</div>
        <div class="log-coords">${loc.lat.toFixed(5)}, ${loc.lng.toFixed(5)}</div>
        <div class="log-acc">精度 ±${loc.accuracy}m</div>
      </div>
      <button class="log-del" onclick="event.stopPropagation(); deleteEntry(${loc.id})" aria-label="削除">×</button>
    </div>`;
  }).join('');
}

function deleteEntry(id) {
  if (!confirm('この記録を削除しますか？')) return;
  locations = locations.filter(l => l.id !== id);
  saveData();
  renderAll();
  setStatus('1件削除しました', '');
}

function clearAll() {
  if (locations.length === 0) return;
  if (!confirm(locations.length + '件すべて削除しますか？')) return;
  locations = [];
  saveData();
  renderAll();
  setStatus('全データを削除しました', '');
}

function exportCSV() {
  if (locations.length === 0) { setStatus('エクスポートするデータがありません', 'danger'); return; }
  const header = 'No,日時,緯度,経度,精度(m)';
  const rows = locations.map((l, i) => `${i+1},${l.label},${l.lat},${l.lng},${l.accuracy}`);
  const csv = '\uFEFF' + [header, ...rows].join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = 'gps_log_' + Date.now() + '.csv';
  a.click();
  setStatus('CSVをダウンロードしました', 'success');
}

initMap();
loadData();
</script>
</body>
</html>
